# admin.dosleduj.example — administrácia
#
# **API beží aj tu, a to zámerne.** Admin je SPA, ktorá volá `/api` na svojom
# vlastnom hostname — takže session cookie zostáva first-party, `SameSite=Lax`
# funguje a nikde netreba CORS. Keby admin volal API na `dosleduj.example`,
# bola by to cross-site požiadavka a autentifikácia by sa musela prerobiť na
# `SameSite=None` (backend-zadanie.md §7, admin-zadanie.md §1).
#
# Dôsledok, s ktorým treba počítať: prihlásenie na tejto doméne je samostatné od
# prihlásenia na verejnej. Cookie je host-only, bez atribútu Domain.
#
# `upstream dosledujto_api` je definovaný v `dosleduj.example.conf` — nginx
# načítava oba súbory do jednej konfigurácie, takže sa nedefinuje dvakrát.

# Blok na porte 80 tu zámerne **nie je**. Tvoj `overseer` config ho tiež nemá —
# HTTP a presmerovanie rieši samotný nginx-certbot image, vrátane cesty
# `/.well-known/acme-challenge/`, ktorou Let's Encrypt overuje doménu.
#
# Keby sme si sem dali vlastný `listen 80` so `server_name`, prebil by ten
# vstavaný a presmeroval by na HTTPS aj overovaciu požiadavku — certbot by
# certifikát nikdy nedostal. Presne to sa stalo.
#
# Ak vlastný blok na porte 80 raz naozaj potrebuješ, musí mať výnimku:
#
#   server {
#       listen 80;
#       server_name <doména>;
#       location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
#       location / { return 301 https://$host$request_uri; }
#   }

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name admin.dosleduj.example;

    ssl_certificate         /etc/letsencrypt/live/dosledujto/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/dosledujto/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dosledujto/chain.pem;
    ssl_dhparam             /etc/letsencrypt/dhparams/dhparam.pem;

    client_max_body_size 2m;

    # Administrácia nemá čo robiť vo vyhľadávačoch. V HTML je `noindex`, toto je
    # druhá vrstva pre roboty, ktoré HTML nečítajú.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Aplikácia je zostavená s base `/admin/`. Na tejto doméne je koreň zbytočný
    # medzikrok, tak naň presmeruj.
    location = / {
        return 302 /admin/;
    }

    # Všetko ostatné ide do aplikácie: `/admin/*` (statické súbory admin SPA,
    # ktoré servíruje Express) aj `/api/*`.
    location / {
        # Voliteľná druhá vrstva pred prihlasovacou obrazovkou. Aplikácia má
        # vlastné prihlásenie a roly, takže je to naozaj len navyše — a treba
        # počítať s tým, že basic auth platí aj pre `/api`, teda aj pre volania
        # zo SPA (prehliadač ich pošle, ale iný klient nie).
        # auth_basic           "Restricted Area";
        # auth_basic_user_file /etc/nginx/user_conf.d/.htpasswd;

        proxy_pass http://dosledujto_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        proxy_read_timeout 120s;
    }
}
