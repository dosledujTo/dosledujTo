# dosleduj.example — verejná časť
#
# Frontend zatiaľ neexistuje. Kým nebude, `/` vracia 503 s vetou, nie nginx
# uvítaciu stránku — návštevník má vedieť, že sa na tom pracuje, a monitoring
# to má vidieť ako výpadok, nie ako úspech.
#
# `/api` beží aj tu, lebo verejný frontend ho bude volať z tejto domény.
# `/admin` je tu **zakázaný** — administrácia má vlastnú doménu a nemá byť
# dostupná dvoma cestami.

upstream dosledujto_api {
    # nginx v kontajneri, ktorý je v sieti `network_dosledujto`:
    server pm2-api-admin:3000;

    # nginx priamo na hoste (kontajner publikuje 3000):
    # server 127.0.0.1:3000;

    keepalive 16;
}

# Blok na porte 80 tu zámerne **nie je**. Tvoj `overseer` config ho tiež nemá —
# HTTP a presmerovanie rieši samotný nginx-certbot image, vrátane cesty
# `/.well-known/acme-challenge/`, ktorou Let's Encrypt overuje doménu.
#
# Keby sme si sem dali vlastný `listen 80` so `server_name`, prebil by ten
# vstavaný a presmeroval by na HTTPS aj overovaciu požiadavku — certbot by
# certifikát nikdy nedostal. Presne to sa stalo.
#
# Ak vlastný blok na porte 80 raz naozaj potrebuješ, musí mať výnimku:
#
#   server {
#       listen 80;
#       server_name <doména>;
#       location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
#       location / { return 301 https://$host$request_uri; }
#   }

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name dosleduj.example;

    ssl_certificate         /etc/letsencrypt/live/dosledujto/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/dosledujto/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dosledujto/chain.pem;
    ssl_dhparam             /etc/letsencrypt/dhparams/dhparam.pem;

    # API prijíma najviac 256 kB JSON; zvyšok odmietne. Tu stačí malý strop —
    # nič väčšie sa cez tento hostname nenahráva.
    client_max_body_size 2m;

    # Administrácia sem nepatrí.
    location /admin {
        return 404;
    }

    # ── API ──────────────────────────────────────────────────────────────────
    # Holé /api nemá čo vracať.
    location = /api  { return 444; }
    location = /api/ { return 444; }

    location /api {
        # Bez cesty za upstreamom: nginx pošle URI nezmenené. S `/api` na konci
        # by sa prefix prepisoval a stačí jeden preklep, aby to tíško rozbilo
        # polovicu ciest.
        proxy_pass http://dosledujto_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Bez tohto by Express považoval spojenie za HTTP a session cookie by
        # neniesla `Secure`. API má `TRUST_PROXY=true` práve kvôli tomuto.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # Prvé volanie na nenahriaty Lucene index môže trvať.
        proxy_read_timeout 120s;
    }

    # ── Verejný web ──────────────────────────────────────────────────────────
    # Stránky renderuje Express (server-side HTML, žiadny SPA build). Nginx teda
    # nemá čo servírovať z disku — všetko ide do aplikácie, vrátane `/assets`,
    # `/robots.txt` a `/sitemap.xml`.
    #
    # Cache-Control si nastavuje aplikácia (stránky 60 s, statické súbory 7 dní),
    # takže sa tu neprepisuje.

    location / {
        proxy_pass http://dosledujto_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        proxy_read_timeout 60s;
    }
}
